services:
  sniffowireless:
    build:
      context: .
      args:  # optional, for the About page: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        VERSION: ${SNIFFOWIRELESS_VERSION:-source}
        COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: sniffowireless:latest
    container_name: sniffowireless
    restart: unless-stopped
    # Host networking is required: monitor-mode Wi-Fi interfaces and HCI Bluetooth
    # adapters live in the host's network namespace.
    network_mode: host
    # Needed to switch adapters into monitor mode, change channels and open raw HCI sockets.
    privileged: true
    env_file:
      - path: .env
        required: false
    environment:
      WIFI_INTERFACES: ${WIFI_INTERFACES:-}
      WIFI_CHANNELS: ${WIFI_CHANNELS:-}
      WIFI_REGDOMAIN: ${WIFI_REGDOMAIN:-}
      BT_DEVICES: ${BT_DEVICES:-}
      ETH_INTERFACES: ${ETH_INTERFACES:-}
      ZIGBEE_DEVICES: ${ZIGBEE_DEVICES:-}
      WEB_PORT: ${WEB_PORT:-8080}
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      DEMO_MODE: ${DEMO_MODE:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
