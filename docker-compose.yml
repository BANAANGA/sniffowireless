services:
  sniffowireless:
    build:
      context: .
      args:  # optional, for the About page: ./scripts/update.sh sets them
        VERSION: ${SNIFFOWIRELESS_VERSION:-source}
        COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: sniffowireless:latest
    container_name: sniffowireless
    restart: unless-stopped
    logging:  # without a limit Docker keeps every log line, which can fill the disk over months
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # Host networking is required: monitor-mode Wi-Fi interfaces and HCI Bluetooth
    # adapters live in the host's network namespace.
    network_mode: host
    # Needed to switch adapters into monitor mode, change channels and open raw HCI sockets.
    privileged: true
    env_file:
      - path: .env
        required: false
    environment:
      WIFI_INTERFACES: ${WIFI_INTERFACES:-}
      WIFI_CHANNELS: ${WIFI_CHANNELS:-}
      WIFI_REGDOMAIN: ${WIFI_REGDOMAIN:-}
      BT_DEVICES: ${BT_DEVICES:-}
      ETH_INTERFACES: ${ETH_INTERFACES:-}
      ZIGBEE_DEVICES: ${ZIGBEE_DEVICES:-}
      LORA_DEVICES: ${LORA_DEVICES:-}
      LORA_REGION: ${LORA_REGION:-EU868}
      LORA_PROFILES: ${LORA_PROFILES:-}
      LORA_HOP_INTERVAL: ${LORA_HOP_INTERVAL:-5}
      WEB_PORT: ${WEB_PORT:-8080}
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      RESET_2FA_USER: ${RESET_2FA_USER:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      DEMO_MODE: ${DEMO_MODE:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
