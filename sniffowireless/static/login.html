<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>sniffowireless · sign in</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='3' fill='%23e6e7e9'/%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%23e6e7e9' stroke-opacity='.4'/%3E%3C/svg%3E">
</head>
<body class="login-page">
<form class="login" id="form" autocomplete="on">
  <div class="brand"><span class="dot"></span>sniffowireless</div>
  <h1 id="title">Sign in</h1>
  <p class="muted" id="intro"></p>
  <label class="field" id="code-field" hidden>Setup code
    <input name="code" autocomplete="off" placeholder="XXXX-XXXX-XXXX">
    <span class="faint small-text">Printed in the container log: <code>docker compose logs sniffowireless | grep "setup code"</code></span></label>
  <label class="field">Username<input name="username" autocomplete="username" required autofocus></label>
  <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
  <label class="field" id="pw2-field" hidden>Repeat password<input name="password2" type="password" autocomplete="new-password"></label>
  <label class="field" id="otp-field" hidden>Authentication code
    <input name="otp" inputmode="text" autocomplete="one-time-code" placeholder="6 digits, or a recovery code" maxlength="32">
    <span class="faint small-text">From your authenticator app. Lost it? Use one of your recovery codes.</span></label>
  <div class="modal-err" id="err"></div>
  <button class="btn primary" id="submit">Sign in</button>
</form>
<script src="/static/theme.js"></script>
<script src="/static/login.js"></script>
</body>
</html>
