name: Docker Image CI

# Pull requests only test that the image builds. A published release (or a manual run on a tag) pushes it to
# ghcr.io/<owner>/sniffowireless for linux/amd64, linux/arm64 and linux/arm/v7 (Raspberry Pi, 64- and 32-bit). A manual run on a branch pushes `edge`.
on:
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Work out the image name (the registry needs it lower-case) and when this is built
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && github.event.release.prerelease != true }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name != 'pull_request' }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/arm/v7' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'pull_request' && 'pr' || 'edge') }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull requests build only amd64 above; this also builds the 32-bit ARM image (Raspberry Pi OS 32-bit) under emulation
      # and imports the app in it, so a dependency without a 32-bit build is caught before a release, not by a user.
      - name: Build the 32-bit ARM image for a smoke test
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm/v7
          load: true
          push: false
          tags: sniffowireless:armv7
          provenance: false
          cache-from: type=gha,scope=armv7
          cache-to: type=gha,scope=armv7,mode=max

      - name: Import the app in the 32-bit ARM image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --platform linux/arm/v7 sniffowireless:armv7 python -c \
            "import platform, sniffowireless.web, sniffowireless.wifi, sniffowireless.bluetooth, sniffowireless.channels, sniffowireless.zigbee, sniffowireless.sensors; print('imports ok on', platform.machine())"
