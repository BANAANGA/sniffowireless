<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>yolo · sign in</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='3' fill='%23e6e7e9'/%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%23e6e7e9' stroke-opacity='.4'/%3E%3C/svg%3E">
</head>
<body class="login-page">
<form class="login" id="form" autocomplete="on">
  <div class="brand"><span class="dot"></span>yolo</div>
  <h1 id="title">Sign in</h1>
  <p class="muted" id="intro"></p>
  <label class="field" id="code-field" hidden>Setup code
    <input name="code" autocomplete="off" placeholder="XXXX-XXXX-XXXX">
    <span class="faint small-text">Printed in the container log: <code>docker compose logs yolo | grep "setup code"</code></span></label>
  <label class="field">Username<input name="username" autocomplete="username" required autofocus></label>
  <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
  <label class="field" id="pw2-field" hidden>Repeat password<input name="password2" type="password" autocomplete="new-password"></label>
  <div class="modal-err" id="err"></div>
  <button class="btn primary" id="submit">Sign in</button>
</form>
<script>
'use strict';
let setup = false;
const f = document.getElementById('form');
const $ = id => document.getElementById(id);
fetch('/api/auth/state').then(r => r.json()).then(st => {
  if (st.user) { location.href = '/'; return; }
  setup = st.setup;
  if (setup) {
    $('title').textContent = 'Create the admin account';
    $('intro').textContent = 'No accounts exist yet. The first account is an administrator; you can add more users later.';
    $('code-field').hidden = $('pw2-field').hidden = false;
    f.password.autocomplete = 'new-password';
    f.password.minLength = 10;
    $('submit').textContent = 'Create account';
    f.code.focus();
  }
});
f.onsubmit = async e => {
  e.preventDefault();
  $('err').textContent = '';
  if (setup && f.password.value !== f.password2.value) { $('err').textContent = 'Passwords do not match'; return; }
  const body = { username: f.username.value.trim(), password: f.password.value };
  if (setup) body.code = f.code.value.trim();
  $('submit').disabled = true;
  const r = await fetch(setup ? '/api/auth/setup' : '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  $('submit').disabled = false;
  if (r.ok) { location.href = '/'; return; }
  const d = (await r.json().catch(() => ({}))).detail;
  $('err').textContent = Array.isArray(d) ? d.map(x => x.msg).join('; ') : d || 'Sign-in failed';
};
</script>
</body>
</html>
