; Receive-only LoRa sniffer firmware for the Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262).
; Build and flash:  pio run -t upload        (needs PlatformIO: https://platformio.org/install/cli)
[env:heltec_v3]
platform = espressif32@6.11.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; The V3's USB-C port is wired to a CP2102 USB-serial chip on UART0, not to the S3's native USB, so Serial must be UART0.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    jgromes/RadioLib@^7.2.0
